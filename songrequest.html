<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#53FC18">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest-songrequest.json">
<title>Song Request — Live Caller Studio</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{
    --g:#53FC18; --g-dim:rgba(83,252,24,0.12); --g-line:rgba(83,252,24,0.35);
    --bk:#060606; --panel:#0e0e0e; --line:#1c1c1c; --tx:#f4f4f4; --sub:#8a8a8a;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100dvh;background:var(--bk);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    padding:calc(20px + var(--safe-top)) 18px calc(28px + var(--safe-bot));
  }
  .wrap{max-width:420px;margin:0 auto;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;margin-bottom:18px;}
  .back:hover{color:var(--g);}
  .hero{margin-bottom:22px;}
  .badge{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--g);background:var(--g-dim);border:1px solid var(--g-line);padding:5px 10px;border-radius:20px;margin-bottom:10px;
  }
  h1{margin:0 0 8px;font-size:26px;font-weight:900;letter-spacing:-0.3px;}
  .sub{margin:0;color:var(--sub);font-size:14px;line-height:1.45;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
  }
  label{display:block;font-size:11px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--sub);margin:0 0 6px;}
  label .req{color:var(--g);}
  .field{margin-bottom:14px;}
  input{
    width:100%;padding:14px 14px;border-radius:12px;border:1px solid #2a2a2a;
    background:#0a0a0a;color:var(--tx);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--g-line);}
  .hint{font-size:12px;color:#666;margin-top:6px;}
  .btn{
    width:100%;margin-top:8px;padding:15px;border:none;border-radius:12px;
    background:var(--g);color:#0a0a0a;font-size:15px;font-weight:900;cursor:pointer;
  }
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .err{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:10px;}
  .done{display:none;text-align:center;padding:28px 12px;}
  .done.show{display:block;}
  .done .ic{font-size:42px;margin-bottom:12px;}
  .done h2{margin:0 0 8px;font-size:20px;}
  .done p{margin:0;color:var(--sub);font-size:14px;line-height:1.45;}
  .done a{display:inline-block;margin-top:18px;color:var(--g);font-weight:700;text-decoration:none;}
  #formCard.hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="home-v2.html">← Home</a>

  <div class="hero">
    <div class="badge">Text only · No mic needed</div>
    <h1>Song Request</h1>
    <p class="sub">Send the artist and title to the studio queue. The producer can put it on the song-request overlay.</p>
  </div>

  <div class="card" id="formCard">
    <div class="field">
      <label for="artist">Artist name <span class="req">*</span></label>
      <input id="artist" maxlength="80" autocomplete="off" placeholder="e.g. Drake" required>
    </div>
    <div class="field">
      <label for="title">Song title <span class="req">*</span></label>
      <input id="title" maxlength="100" autocomplete="off" placeholder="e.g. God's Plan" required>
    </div>
    <div class="field">
      <label for="name">Your name <span style="font-weight:600;text-transform:none;letter-spacing:0;color:#555">(optional)</span></label>
      <input id="name" maxlength="40" autocomplete="name" placeholder="How should we shout you out?">
    </div>
    <div class="field">
      <label for="city">City <span style="font-weight:600;text-transform:none;letter-spacing:0;color:#555">(optional)</span></label>
      <input id="city" maxlength="60" autocomplete="address-level2" placeholder="Where you're listening from">
    </div>
    <button class="btn" id="sendBtn" type="button">Send Song Request</button>
    <div class="err" id="err"></div>
    <div class="hint">Only artist and song title are required.</div>
  </div>

  <div class="done" id="done">
    <div class="ic">🎵</div>
    <h2>Request sent</h2>
    <p>Your song is in the studio queue. Keep listening — the DJ may play it next.</p>
    <a href="home-v2.html">Back home</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDNVCh-ayI5GzeboqKbQoFI5vsfSF8IaCc",
  authDomain: "djdeeze-hotline.firebaseapp.com",
  projectId: "djdeeze-hotline",
  storageBucket: "djdeeze-hotline.firebasestorage.app",
  messagingSenderId: "663942225296",
  appId: "1:663942225296:web:c6117cf6c23656b9842715"
});
const db = getFirestore(app);

const artist = document.getElementById('artist');
const title = document.getElementById('title');
const nameEl = document.getElementById('name');
const cityEl = document.getElementById('city');
const sendBtn = document.getElementById('sendBtn');
const err = document.getElementById('err');
const formCard = document.getElementById('formCard');
const done = document.getElementById('done');

function allowSubmit(){
  try{
    const k = 'lcs_last_song_req';
    const now = Date.now();
    const last = Number(localStorage.getItem(k) || 0);
    if(now - last < 12000) return false;
    localStorage.setItem(k, String(now));
    return true;
  }catch(e){ return true; }
}

async function send(){
  err.textContent = '';
  const a = artist.value.trim();
  const s = title.value.trim();
  if(!a){ err.textContent = 'Artist name is required.'; artist.focus(); return; }
  if(!s){ err.textContent = 'Song title is required.'; title.focus(); return; }
  if(!allowSubmit()){ err.textContent = 'Please wait a few seconds before sending another request.'; return; }

  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  try{
    await addDoc(collection(db, 'songRequests'), {
      artist: a.slice(0, 80),
      songTitle: s.slice(0, 100),
      name: nameEl.value.trim().slice(0, 40) || null,
      city: cityEl.value.trim().slice(0, 60) || null,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    formCard.classList.add('hide');
    done.classList.add('show');
  }catch(e){
    console.error(e);
    err.textContent = 'Could not send — check your connection and try again.';
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send Song Request';
  }
}

sendBtn.addEventListener('click', send);
[artist, title, nameEl, cityEl].forEach(el=>{
  el.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') send(); });
});
</script>
</body>
</html>
