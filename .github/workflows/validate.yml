name: Validate Live Caller Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static checks and line-state tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript, manifests, and local references
        run: node --experimental-default-type=module tests/check-syntax.mjs
      - name: Test service-worker cache freshness and offline fallback
        run: node --experimental-default-type=module tests/service-worker.test.mjs
      - name: Test line-state resolution
        run: node --experimental-default-type=module tests/line-state.test.mjs
      - name: Test three-line call manager routing safety
        run: node --experimental-default-type=module tests/multi-line-call-manager.test.mjs
      - name: Test producer WebRTC session isolation
        run: node --experimental-default-type=module tests/producer-call-session.test.mjs
      - name: Test three-line media controller integration
        run: node --experimental-default-type=module tests/multi-line-media-controller.test.mjs
      - name: Test per-call Firestore multi-line adapter
        run: node --experimental-default-type=module tests/firestore-multi-line-adapter.test.mjs
      - name: Test isolated program and monitor audio routing
        run: node --experimental-default-type=module tests/program-audio-router.test.mjs
      - name: Test three-line dashboard view actions
        run: node --experimental-default-type=module tests/multi-line-dashboard-view.test.mjs
      - name: Test selected-caller OBS audio relay bridge
        run: node --experimental-default-type=module tests/multi-line-overlay-relay-bridge.test.mjs
      - name: Test per-call OBS overlay relay signaling
        run: node --experimental-default-type=module tests/multi-line-overlay-relay-adapter.test.mjs
      - name: Test OBS overlay active call statuses
        run: node --experimental-default-type=module tests/overlay-call-status.test.mjs
      - name: Test public home page line-state behavior
        run: node --experimental-default-type=module tests/home-v2.behavior.test.mjs
      - name: Test caller cleanup regressions
        run: node --experimental-default-type=module tests/call-cleanup.test.mjs
      - name: Test caller hold music audio context lifecycle
        run: node --experimental-default-type=module tests/caller-hold-audio-playback.test.mjs
      - name: Test automatic dashboard caller audio without monitor controls
        run: node --experimental-default-type=module tests/dashboard-auto-caller-audio.test.mjs
      - name: Test anonymous video caller authentication compatibility
        run: node --experimental-default-type=module tests/call-anonymous-video-auth.test.mjs
      - name: Test production-safety guardrails
        run: node --experimental-default-type=module tests/production-safety.test.mjs
