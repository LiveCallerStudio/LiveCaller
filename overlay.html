<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Caller Studio OBS Overlay</title>
<style>
:root{--green:#53fc18;--red:#ff3939}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{position:relative;width:100vw;height:100vh;display:flex;align-items:flex-end;justify-content:flex-end;padding:3.2%;pointer-events:none}
#video{position:absolute;right:3.2%;bottom:3.2%;width:min(38vw,640px);max-height:72vh;aspect-ratio:16/9;object-fit:cover;border:3px solid var(--green);border-radius:14px;background:#090909;box-shadow:0 0 24px #000;display:none}
#lower{position:absolute;left:3.2%;bottom:5%;display:none;min-width:300px;max-width:62vw;background:rgba(5,5,5,.94);border-left:7px solid var(--green);padding:16px 22px;border-radius:7px;box-shadow:0 8px 32px #0009;animation:enter .22s ease-out}
#kind{font-weight:900;font-size:clamp(14px,1.8vw,24px);letter-spacing:1.2px;color:var(--green);text-transform:uppercase}#name{font-size:clamp(20px,3vw,42px);font-weight:900;margin-top:4px;text-shadow:0 2px 4px #000}#city{font-size:clamp(12px,1.3vw,18px);color:#ddd;margin-top:4px}
#status{position:absolute;top:12px;right:12px;padding:6px 9px;border-radius:5px;background:#111c;color:#ddd;font-size:11px;opacity:.8}#status.bad{color:#ff6868}#audio{display:none}
@keyframes enter{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:700px){#lower{min-width:0;max-width:90vw;left:4%;bottom:4%;padding:12px 15px}#video{width:92vw;right:4%;bottom:24%;max-height:60vh}}
</style>
</head><body>
<div id="stage"><div id="status">OBS media: waiting</div><video id="video" autoplay playsinline></video><audio id="audio" autoplay playsinline></audio><section id="lower"><div id="kind">LIVE CALL</div><div id="name">Caller</div><div id="city"></div></section></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, doc, onSnapshot, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDNVCh-ayI5GzeboqKbQoFI5vsfSF8IaCc',authDomain:'djdeeze-hotline.firebaseapp.com',projectId:'djdeeze-hotline',storageBucket:'djdeeze-hotline.firebasestorage.app',messagingSenderId:'663942225296',appId:'1:663942225296:web:c6117cf6c23656b9842715'};
const db=getFirestore(initializeApp(firebaseConfig));
// Expose the Firestore instance for any overlay integrations that use the global scope.
window.db = db; window.firebaseDb = db;
const stateRef=doc(db,'hotlineLive','nowPlaying');const routeRef=doc(db,'hotlineLive','overlayCall');
const statusEl=document.getElementById('status'),lower=document.getElementById('lower'),kind=document.getElementById('kind'),nameEl=document.getElementById('name'),cityEl=document.getElementById('city'),videoEl=document.getElementById('video'),audioEl=document.getElementById('audio');
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]};
let pc=null,activeCallId=null,offerCandidateUnsub=null,answerCandidateUnsub=null,seenOfferKey='';
function status(t,bad=false){statusEl.textContent=t;statusEl.classList.toggle('bad',bad)}
function closeMedia(){if(pc){pc.close();pc=null}if(offerCandidateUnsub){offerCandidateUnsub();offerCandidateUnsub=null}if(answerCandidateUnsub){answerCandidateUnsub();answerCandidateUnsub=null}videoEl.srcObject=null;audioEl.srcObject=null;videoEl.style.display='none';lower.style.display='none';activeCallId=null;seenOfferKey=''}
async function connectOffer(data){
 if(!data?.active||!data.offer||!data.callId){closeMedia();status('OBS media: waiting');return}
 const key=data.callId+':'+data.offer.sdp;if(key===seenOfferKey)return;closeMedia();seenOfferKey=key;activeCallId=data.callId;
 pc=new RTCPeerConnection(ice);const thisPc=pc;const stream=new MediaStream();
 pc.ontrack=e=>{const incoming=e.streams?.[0];if(incoming){incoming.getTracks().forEach(t=>{if(!stream.getTracks().some(x=>x.id===t.id))stream.addTrack(t)})}else stream.addTrack(e.track);audioEl.srcObject=stream;audioEl.play().catch(()=>{});if(stream.getVideoTracks().length){videoEl.srcObject=stream;videoEl.style.display='block';videoEl.play().catch(()=>{})}status(`OBS media: connected · ${stream.getAudioTracks().length?'audio':'no audio'} · ${stream.getVideoTracks().length?'video':'audio only'}`)};
 pc.onconnectionstatechange=()=>{if(thisPc!==pc)return;status('OBS media: '+pc.connectionState,pc.connectionState==='failed')};
 pc.onicecandidate=e=>{if(e.candidate&&activeCallId)addDoc(collection(db,'hotlineLive','overlayCall','sessions',activeCallId,'answerCandidates'),e.candidate.toJSON()).catch(err=>status('ICE write failed',true))};
 try{await pc.setRemoteDescription(new RTCSessionDescription(data.offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js').then(async m=>m.updateDoc(routeRef,{answer:{type:answer.type,sdp:answer.sdp}}));
 offerCandidateUnsub=onSnapshot(collection(db,'hotlineLive','overlayCall','sessions',activeCallId,'offerCandidates'),snap=>{snap.docChanges().forEach(c=>{if(c.type==='added'&&pc===thisPc)thisPc.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{})})});
 }catch(err){status('OBS connection error: '+(err?.message||err),true);console.error(err)}
}
onSnapshot(routeRef,snap=>{connectOffer(snap.data()).catch(e=>status('OBS connection error',true))},err=>status('Firestore error: '+err.code,true));
onSnapshot(stateRef,snap=>{
 const d=snap.data();
 if(d?.active){
  lower.style.display='block';nameEl.textContent=d.name||'Live Caller';cityEl.textContent=d.city||'';
  kind.textContent=d.messageType==='videocall'?'LIVE VIDEO CALL':d.messageType==='livecall'?'LIVE AUDIO CALL':(d.messageType==='voice'||d.audioUrl)?'VOICE / SONG REQUEST':'LIVE CALL';
  // For recorded voice messages and song-request recordings, play the Firestore nowPlaying URL
  // directly in OBS. Live caller audio/video continues to use the WebRTC overlay route.
  if(d.audioUrl && d.messageType!=='livecall' && d.messageType!=='videocall'){
   if(audioEl.srcObject) audioEl.srcObject=null;
   if(audioEl.src!==d.audioUrl){audioEl.src=d.audioUrl;audioEl.currentTime=0;}
   audioEl.play().then(()=>status('OBS media: playing request audio')).catch(()=>status('OBS media: click to allow audio',true));
  }
 }else{
  lower.style.display='none';
  if(!routeRef) return;
  if(!audioEl.srcObject){audioEl.pause();audioEl.removeAttribute('src');audioEl.load();}
 }
});
</script></body></html>
