<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Song Request Overlay — OBS</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{ --g:#53FC18; --g2:#b8ff3c; }
  html,body{
    margin:0;padding:0;background:transparent;overflow:hidden;
    width:1920px;height:1080px;
    font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;
  }

  /* Full lower-third song request plate — dedicated overlay */
  .song-lt{
    position:fixed;left:48px;bottom:56px;
    display:flex;align-items:stretch;
    transform:translateY(120%);opacity:0;
    transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .35s ease;
    z-index:10;max-width:920px;
  }
  .song-lt.show{transform:translateY(0);opacity:1;}

  .bar{
    width:8px;background:linear-gradient(180deg,var(--g2),var(--g));
    border-radius:6px 0 0 6px;
    box-shadow:0 0 24px rgba(83,252,24,.55);
  }
  .plate{
    background:linear-gradient(90deg,rgba(8,8,8,.96),rgba(8,8,8,.88) 70%,rgba(8,8,8,.55));
    border:2px solid rgba(83,252,24,.55);
    border-left:none;border-radius:0 16px 16px 0;
    padding:16px 28px 16px 22px;
    min-width:420px;
  }
  .tag{
    color:var(--g);font-size:12px;letter-spacing:3px;text-transform:uppercase;
    font-weight:900;margin-bottom:6px;
  }
  .title{
    color:#fff;font-size:32px;font-weight:900;letter-spacing:.3px;
    text-shadow:0 0 18px rgba(0,0,0,.85);line-height:1.15;
  }
  .artist{
    color:#d0d0d0;font-size:18px;font-weight:700;font-family:Arial,Helvetica,sans-serif;
    margin-top:6px;
  }
  .meta{
    margin-top:10px;font-size:13px;color:#888;font-family:Arial,Helvetica,sans-serif;font-weight:600;
  }
  .meta span{color:var(--g);}

  /* Corner badge when idle / queue depth */
  .qbadge{
    position:fixed;top:40px;right:40px;
    background:rgba(10,10,10,.9);border:1px solid rgba(83,252,24,.4);
    border-radius:12px;padding:12px 16px;
    opacity:0;transform:translateY(-20px);
    transition:opacity .3s,transform .3s;
    font-family:Arial,Helvetica,sans-serif;
  }
  .qbadge.show{opacity:1;transform:translateY(0);}
  .ql{font-size:10px;font-weight:900;letter-spacing:2px;color:#666;text-transform:uppercase;}
  .qn{font-size:22px;font-weight:900;color:var(--g);margin-top:2px;}
</style>
</head>
<body>

<div class="song-lt" id="songLt">
  <div class="bar"></div>
  <div class="plate">
    <div class="tag" id="tag">🎵 Song Request</div>
    <div class="title" id="songTitle">—</div>
    <div class="artist" id="artistName">—</div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<div class="qbadge" id="qbadge">
  <div class="ql">Song queue</div>
  <div class="qn" id="qnum">0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, collection, query, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDNVCh-ayI5GzeboqKbQoFI5vsfSF8IaCc",
  authDomain: "djdeeze-hotline.firebaseapp.com",
  projectId: "djdeeze-hotline",
  storageBucket: "djdeeze-hotline.firebasestorage.app",
  messagingSenderId: "663942225296",
  appId: "1:663942225296:web:c6117cf6c23656b9842715"
});
const db = getFirestore(app);

const songLt = document.getElementById('songLt');
const songTitle = document.getElementById('songTitle');
const artistName = document.getElementById('artistName');
const meta = document.getElementById('meta');
const qbadge = document.getElementById('qbadge');
const qnum = document.getElementById('qnum');

// Live on-air song plate — producer writes to songRequestLive/now
onSnapshot(doc(db, 'songRequestLive', 'now'), (snap) => {
  const d = snap.data();
  if(d && d.active && d.songTitle){
    songTitle.textContent = d.songTitle;
    artistName.textContent = d.artist || '';
    const bits = [];
    if(d.name) bits.push(`From <span>${escapeHtml(d.name)}</span>`);
    if(d.city) bits.push(escapeHtml(d.city));
    meta.innerHTML = bits.join(' · ');
    songLt.classList.add('show');
  } else {
    songLt.classList.remove('show');
  }
});

// Pending count badge
onSnapshot(
  query(collection(db, 'songRequests'), orderBy('createdAt', 'desc')),
  (snap) => {
    const n = snap.docs.filter(d => d.data().status === 'pending').length;
    qnum.textContent = n;
    qbadge.classList.toggle('show', n > 0);
  }
);

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
