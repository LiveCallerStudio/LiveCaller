<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0a"><title>Live Caller Studio — Video Call</title>
<style>
:root{--green:#53fc18;--bg:#0a0a0a;--panel:#151515;--muted:#999;--red:#ff4141}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17210f,var(--bg) 60%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(560px,100%);background:#111;border:1px solid #2c2c2c;border-radius:22px;padding:24px;box-shadow:0 20px 70px #0009}.brand{color:var(--green);font-size:12px;font-weight:900;letter-spacing:2px}h1{font-size:32px;margin:12px 0 8px}p{color:var(--muted);line-height:1.5}.field{width:100%;padding:14px 15px;border-radius:10px;border:1px solid #333;background:#090909;color:#fff;margin:7px 0 12px;font-size:16px}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--green);color:#080808;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.5}.video-wrap{display:none;margin-top:16px}.video-wrap.show{display:block}/* Mirror local self-view only; WebRTC tracks sent to screening/OBS are unchanged. */video{width:100%;max-height:380px;background:#000;border-radius:14px;object-fit:cover;transform:scaleX(-1)}.status{padding:12px;border:1px solid #303030;border-radius:10px;margin-top:14px;color:var(--green);font-weight:700}.small{font-size:12px;color:#777}
</style></head><body><main class="app"><div class="brand">ϟ LIVE CALLER STUDIO</div><h1>Video Call In</h1><p>Join the live show with your camera and microphone. Your audio and video are sent to the OBS overlay only after the producer sends you on air.</p><div id="form"><label for="name">Your name</label><input class="field" id="name" maxlength="40" placeholder="Enter your name" autocomplete="name"><label for="city">City (optional)</label><input class="field" id="city" maxlength="40" placeholder="Your city"><button class="btn" id="join" disabled>Checking video line…</button></div><div class="video-wrap" id="videoWrap"><video id="preview" autoplay playsinline muted></video></div><div class="status" id="status">Waiting to join…</div><p class="small">Keep this page open while you are in the queue or on air.</p></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import { getFirestore, collection, doc, addDoc, updateDoc, getDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import { LINE, resolveLineStates } from './lib/line-state.js';
const firebaseConfig={apiKey:'AIzaSyDNVCh-ayI5GzeboqKbQoFI5vsfSF8IaCc',authDomain:'djdeeze-hotline.firebaseapp.com',projectId:'djdeeze-hotline',storageBucket:'djdeeze-hotline.firebasestorage.app',messagingSenderId:'663942225296',appId:'1:663942225296:web:c6117cf6c23656b9842715'};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const guestAuthApp=initializeApp(firebaseConfig,'videoGuestAuth');const auth=getAuth(guestAuthApp);const join=document.getElementById('join'),statusEl=document.getElementById('status'),form=document.getElementById('form'),preview=document.getElementById('preview'),videoWrap=document.getElementById('videoWrap');let stream=null,callRef=null,sessionUnsub=null,pcMap=new Map(),guestUid=null,screeningPc=null,screeningCandidatesUnsub=null,screeningSessionId=null;let videoLineState=LINE.UNKNOWN,joinInProgress=false;function renderJoinAvailability(){join.disabled=videoLineState!==LINE.OPEN||joinInProgress;if(callRef)return;if(videoLineState===LINE.OPEN){join.textContent='Join Video Queue';statusEl.textContent='Video line is open. Enter your name to join the queue.';}else if(videoLineState===LINE.CLOSED){join.textContent='Video Line Closed';statusEl.textContent='Video guests are currently closed. Please check back soon.';}else{join.textContent='Checking Video Line…';statusEl.textContent='Checking whether video guests are being accepted…';}}onSnapshot(doc(db,'hotlineSettings','callLines'),{includeMetadataChanges:true},snap=>{videoLineState=resolveLineStates(snap).video;renderJoinAvailability();},err=>{videoLineState=LINE.UNKNOWN;renderJoinAvailability();console.warn('Video line status unavailable:',err&&err.code);});const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]};
async function closeScreeningPeer(){if(screeningCandidatesUnsub){screeningCandidatesUnsub();screeningCandidatesUnsub=null;}if(screeningPc){try{screeningPc.close();}catch(e){}screeningPc=null;}screeningSessionId=null;}
async function answerScreeningSession(id){if(!id||!callRef||!stream||id===screeningSessionId||!guestUid)return;await closeScreeningPeer();const sessionRef=doc(db,'videoCalls',callRef.id,'screeningSessions',id);const sessionSnap=await getDoc(sessionRef);const sessionData=sessionSnap.data();if(!sessionData||!sessionData.offer||sessionData.client!=='dashboard-screen')return;const pc=new RTCPeerConnection(ice);screeningPc=pc;screeningSessionId=id;pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(sessionRef,'guestCandidates'),e.candidate.toJSON()).catch(err=>{console.warn('Screening ICE write failed:',err&&err.code);statusEl.textContent='Screening signaling was blocked by Firestore rules.';});};pc.onconnectionstatechange=()=>{if(screeningPc!==pc)return;if(pc.connectionState==='connected')statusEl.textContent='Producer is screening your camera and microphone. You are NOT on air.';else if(pc.connectionState==='failed')statusEl.textContent='Private preview connection failed. Check network/TURN and Firestore rules.';else if(pc.connectionState==='disconnected')statusEl.textContent='Preview connection interrupted; attempting to recover…';};try{await pc.setRemoteDescription(new RTCSessionDescription(sessionData.offer));for(const t of pc.getTransceivers()){const kind=t.receiver?.track?.kind;const track=kind==='audio'?stream.getAudioTracks()[0]:kind==='video'?stream.getVideoTracks()[0]:null;if(track){t.direction='sendonly';await t.sender.replaceTrack(track);}else t.direction='inactive';}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await updateDoc(sessionRef,{answer:{type:answer.type,sdp:answer.sdp},answeredBy:guestUid,answeredAt:Date.now()});screeningCandidatesUnsub=onSnapshot(collection(sessionRef,'producerCandidates'),snap=>snap.docChanges().forEach(change=>{if(change.type==='added'&&screeningPc===pc&&pc.signalingState!=='closed')pc.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(err=>console.warn('Screening ICE add failed:',err&&err.name));}),err=>{if(screeningPc===pc)statusEl.textContent='Preview ICE signaling failed: '+(err.code||'permission denied');});}catch(err){if(screeningPc===pc)await closeScreeningPeer();console.warn('Screening connection failed:',err);statusEl.textContent='Could not connect private preview: '+(err.message||'check permissions and network');}}
join.addEventListener('click',async()=>{if(videoLineState!==LINE.OPEN){renderJoinAvailability();return;}joinInProgress=true;renderJoinAvailability();try{const name=document.getElementById('name').value.trim();if(!name)throw new Error('Enter your name first.');const credential=auth.currentUser?{user:auth.currentUser}:await signInAnonymously(auth);guestUid=credential.user.uid;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:{facingMode:'user'}});preview.srcObject=stream;videoWrap.classList.add('show');callRef=await addDoc(collection(db,'videoCalls'),{callerName:name,callerCity:document.getElementById('city').value.trim()||null,status:'waiting',createdAt:serverTimestamp(),guestUid});form.style.display='none';statusEl.textContent='In queue — waiting for producer approval.';onSnapshot(callRef,snap=>{const d=snap.data();if(!d)return;if(d.status==='live'){closeScreeningPeer();statusEl.textContent='ON AIR — your camera and microphone are live.';}else if(d.status==='rejected'||d.status==='ended'){statusEl.textContent=d.status==='rejected'?'The producer declined this call.':'The call has ended.';stopMedia();}else if(d.status==='waiting'&&d.screeningSessionId){answerScreeningSession(d.screeningSessionId).catch(err=>{console.warn('Screening session could not start:',err);statusEl.textContent='Private preview could not start. Check Firestore rules and retry.';});}else if(d.status==='waiting'&&!d.screeningSessionId){closeScreeningPeer();statusEl.textContent='In queue — waiting for producer approval.';}});sessionUnsub=onSnapshot(collection(db,'videoCalls',callRef.id,'overlaySessions'),snap=>{
  snap.docChanges().forEach(async change=>{
    if(change.type!=='added')return;
    const sessionId=change.doc.id,sessionData=change.doc.data();
    if(!sessionData.offer||pcMap.has(sessionId)||!stream)return;
    const sessionRef=doc(db,'videoCalls',callRef.id,'overlaySessions',sessionId),pc=new RTCPeerConnection(ice);
    pcMap.set(sessionId,pc);
    pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(sessionRef,'dashboardCandidates'),e.candidate.toJSON()).catch(err=>console.warn('OBS candidate write failed',err));};
    pc.onconnectionstatechange=()=>{
      console.info('OBS guest media peer:',pc.connectionState);
      if(pc.connectionState==='failed'||pc.connectionState==='disconnected') statusEl.textContent='OBS media connection '+pc.connectionState+'. Check the overlay Browser Source/network.';
    };
    try{
      // The overlay offers recvonly audio/video sections. Set that offer first,
      // then attach microphone/camera to those exact transceivers before answering.
      await pc.setRemoteDescription(new RTCSessionDescription(sessionData.offer));
      for(const transceiver of pc.getTransceivers()){
        const kind=transceiver.receiver?.track?.kind;
        // Only the video guest's own camera/mic tracks are sent to OBS.
        // The producer microphone is never part of this guest stream.
        const track=kind==='audio' ? stream.getAudioTracks()[0] : kind==='video' ? stream.getVideoTracks()[0] : null;
        if(track){
          transceiver.direction='sendonly';
          await transceiver.sender.replaceTrack(track);
        } else {
          transceiver.direction='inactive';
        }
      }
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await updateDoc(sessionRef,{answer:{type:answer.type,sdp:answer.sdp},updatedAt:Date.now()});
      onSnapshot(collection(sessionRef,'overlayCandidates'),cs=>cs.docChanges().forEach(cc=>{
        if(cc.type==='added'&&pc.signalingState!=='closed')pc.addIceCandidate(new RTCIceCandidate(cc.doc.data())).catch(err=>console.warn('OBS ICE add failed',err));
      }),err=>console.warn('OBS overlay candidate listener failed',err));
    }catch(err){console.error('OBS video overlay connection failed',err);statusEl.textContent='OBS connection problem: '+err.message;pc.close();pcMap.delete(sessionId);}
  });
},err=>{console.error('OBS video session listener failed',err);statusEl.textContent='OBS signaling error: '+err.message;});
}catch(err){statusEl.textContent=err.message||'Could not start camera/microphone.';joinInProgress=false;renderJoinAvailability();statusEl.textContent=err.message||'Could not start camera/microphone.';}});
function stopMedia(){if(sessionUnsub){sessionUnsub();sessionUnsub=null;}closeScreeningPeer();pcMap.forEach(pc=>pc.close());pcMap.clear();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}preview.srcObject=null;}
window.addEventListener('beforeunload',()=>{stopMedia();if(callRef)updateDoc(callRef,{status:'ended'}).catch(()=>{});});
</script></body></html>
